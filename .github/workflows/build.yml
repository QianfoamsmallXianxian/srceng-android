name: build-apk
on:
  push:
    branches: [ main, con-wrappers ]
  pull_request:
    branches: [ main, con-wrappers ]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CFG: debug
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-
      - run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y make unzip ccache file openjdk-8-jdk ant ant-contrib python3-requests python3-pip zlib1g:i386 libc6:i386 libstdc++6:i386
          sudo pip3 install websocket-client
      - run: |
          git clone --depth 1 https://gitlab.com/LostGamer/ndk-binaries
          git clone --depth 1 https://gitlab.com/LostGamer/android-sdk
          git clone --depth 1 https://github.com/nillerusr/srcsdk
          cd srcsdk && git submodule update --init --recursive --depth 1 && cd ..
      - name: verify env
        run: |
          echo "libs=$(ls libs/armeabi-v7a | wc -l)"
          ls ndk-binaries/toolchains/ | grep arm-linux
          ls android-sdk/platforms/
          echo "--- tools/ant ---"
          ls android-sdk/tools/ant/ 2>/dev/null || echo "NO tools/ant"
          test -f android-sdk/tools/ant/build.xml && echo "OK tools/ant/build.xml" || { echo "MISSING tools/ant/build.xml"; exit 1; }
      - env:
          DEPLOY_BRANCH: ci
          COMMIT: ${{ github.sha }}
        run: bash scripts/workflow.sh
      - run: |
          APK=$(ls -1t bin/*.apk | head -n1)
          COUNT=$(unzip -l "$APK" | awk '/lib\/.+\.so$/ {print $4}' | wc -l)
          echo "libs: $COUNT"
          [ "$COUNT" -ge 30 ] || exit 1
          unzip -l "$APK" | awk '/lib\/.+\.so$/ {print $4}' | grep -q '^lib/armeabi-v7a/' || exit 1
      - name: Verify APK
        if: success()
        run: |
          ls -lh bin/srceng-debug.apk
          file bin/srceng-debug.apk
          unzip -l bin/srceng-debug.apk | grep "lib/armeabi-v7a" | wc -l
      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: srceng-apk-${{ github.sha }}
          path: |
            bin/srceng-debug.apk
            build-debug.log
          if-no-files-found: warn
